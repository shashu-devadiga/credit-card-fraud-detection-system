<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Card Fraud Detection</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>
<!-- Header -->
<div class="header">
    <h1>Credit Card Fraud Detection</h1>
    <p>
        Enter the transaction details below to check if it is legitimate or fraudulent.
    </p>
</div>


<!-- Main Content -->
<div class="container">

    <!-- Transaction Details -->
    <div class="card">

        <h2>Transaction Details</h2>

        <form>

            <div class="form-grid">

                <!-- Card Number -->
                <div class="form-group">
                    <label>Card Number</label>
                    <input
                        type="text"
                        name="card_number"
                        placeholder="Enter 16 digit card number"
                        maxlength="16"
                        required
                    >
                </div>


                <!-- Amount -->
                <div class="form-group">
                    <label>Amount ($)</label>
                    <input
                        type="number"
                        name="amount"
                        placeholder="Enter transaction amount"
                        step="0.01"
                        min="0"
                        required
                    >
                </div>


                <!-- Category -->
                <div class="form-group">
                    <label>Category</label>

                    <select name="category" required>
                        <option value="">Select Category</option>
                        <option value="entertainment">entertainment</option>
                        <option value="food_dining">food_dining</option>
                        <option value="gas_transport">gas_transport</option>
                        <option value="grocery_net">grocery_net</option>
                        <option value="grocery_pos">grocery_pos</option>
                        <option value="health_fitness">health_fitness</option>
                        <option value="home">home</option>
                        <option value="kids_pets">kids_pets</option>
                        <option value="misc_net">misc_net</option>
                        <option value="misc_pos">misc_pos</option>
                        <option value="personal_care">personal_care</option>
                        <option value="shopping_net">shopping_net</option>
                        <option value="shopping_pos">shopping_pos</option>
                        <option value="travel">travel</option>
                    </select>
                </div>


                <!-- Gender -->
                <div class="form-group">
                    <label>Gender</label>

                    <select name="Gender" required>
                        <option value="">Select Gender</option>
                        <option value="F">F</option>
                        <option value="M">M</option>
                    </select>
                </div>


                <!-- State -->
                <div class="form-group">
                    <label>State</label>

                    <select name="State" required>
                        <option value="">Select State</option>
                        <option value="AK">AK</option>
                        <option value="AL">AL</option>
                        <option value="AR">AR</option>
                        <option value="AZ">AZ</option>
                        <option value="CA">CA</option>
                        <option value="CO">CO</option>
                        <option value="CT">CT</option>
                        <option value="DC">DC</option>
                        <option value="FL">FL</option>
                        <option value="GA">GA</option>
                        <option value="HI">HI</option>
                        <option value="IA">IA</option>
                        <option value="ID">ID</option>
                        <option value="IL">IL</option>
                        <option value="IN">IN</option>
                        <option value="KS">KS</option>
                        <option value="KY">KY</option>
                        <option value="LA">LA</option>
                        <option value="MA">MA</option>
                        <option value="MD">MD</option>
                        <option value="ME">ME</option>
                        <option value="MI">MI</option>
                        <option value="MN">MN</option>
                        <option value="MO">MO</option>
                        <option value="MS">MS</option>
                        <option value="MT">MT</option>
                        <option value="NC">NC</option>
                        <option value="ND">ND</option>
                        <option value="NE">NE</option>
                        <option value="NH">NH</option>
                        <option value="NJ">NJ</option>
                        <option value="NM">NM</option>
                        <option value="NV">NV</option>
                        <option value="NY">NY</option>
                        <option value="OH">OH</option>
                        <option value="OK">OK</option>
                        <option value="OR">OR</option>
                        <option value="PA">PA</option>
                        <option value="RI">RI</option>
                        <option value="SC">SC</option>
                        <option value="SD">SD</option>
                        <option value="TN">TN</option>
                        <option value="TX">TX</option>
                        <option value="UT">UT</option>
                        <option value="VA">VA</option>
                        <option value="VT">VT</option>
                        <option value="WA">WA</option>
                        <option value="WI">WI</option>
                        <option value="WV">WV</option>
                        <option value="WY">WY</option>
                    </select>
                </div>


                <!-- ZIP Code -->
                <div class="form-group">
                    <label>ZIP Code</label>

                    <input
                        type="text"
                        name="zip"
                        placeholder="Enter ZIP code"
                        required
                    >
                </div>


                <!-- City Population -->
                <div class="form-group">
                    <label>City Population</label>

                    <input
                        type="number"
                        name="city_population"
                        placeholder="Enter city population"
                        min="0"
                        required
                    >
                </div>


                <!-- Customer Latitude -->
                <div class="form-group">
                    <label>Customer Latitude</label>

                    <input
                        type="number"
                        name="customer_latitude"
                        placeholder="Enter customer latitude"
                        step="any"
                        required
                    >
                </div>


                <!-- Customer Longitude -->
                <div class="form-group">
                    <label>Customer Longitude</label>

                    <input
                        type="number"
                        name="customer_longitude"
                        placeholder="Enter customer longitude"
                        step="any"
                        required
                    >
                </div>


                <!-- Merchant Latitude -->
                <div class="form-group">
                    <label>Merchant Latitude</label>

                    <input
                        type="number"
                        name="merchant_latitude"
                        placeholder="Enter merchant latitude"
                        step="any"
                        required
                    >
                </div>


                <!-- Merchant Longitude -->
                <div class="form-group">
                    <label>Merchant Longitude</label>

                    <input
                        type="number"
                        name="merchant_longitude"
                        placeholder="Enter merchant longitude"
                        step="any"
                        required
                    >
                </div>


                <!-- Transaction Date and Time -->
                <div class="form-group full">
                    <label>Transaction Date and Time</label>

                    <input
                        type="datetime-local"
                        name="transaction_datetime"
                        required
                    >
                </div>

            </div>


            <!-- Check Button -->
            <button type="submit" class="check-btn">
                Check Transaction
            </button>

        </form>

    </div>


    <!-- Result -->
    <div class="card">

        <h2>Result</h2>

        <div class="result-box">

            <div class="result-icon">?</div>

            <div class="result-text">
                Enter the details and click
                <b>"Check Transaction"</b>
                <br>
                to see the result.
            </div>

        </div>

    </div>

</div>


<!-- JavaScript -->
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
